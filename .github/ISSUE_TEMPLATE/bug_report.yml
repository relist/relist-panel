name: Bug report
description: Something in the panel does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Panel version
      description: Shown in the panel's header, or `docker exec relist-panel relist-panel version`.
    validations:
      required: true
  - type: textarea
    id: host
    attributes:
      label: Host
      description: Output of `docker version` and `docker compose version`, and the OS.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Panel log
      description: "`docker logs --tail 200 relist-panel`. Remove anything private first."
      render: text
