# Publishes a release from a v* tag: the image to GHCR, then the signed Update
# manifest on the GitHub Release (ADR-0024). The signing key is the repo secret
# RELIST_RELEASE_KEY; the public half is the constant in
# internal/panelupdate/key.go, so the workflow never takes it from anywhere else.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Read the version and the public key
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          key=$(sed -n 's/^var releasePublicKey = "\(.*\)"$/\1/p' internal/panelupdate/key.go)
          if [ -z "$key" ]; then
            echo "::error::releasePublicKey in internal/panelupdate/key.go is empty; commit the real public key first"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/relist/relist-panel:${{ steps.meta.outputs.version }}
            ghcr.io/relist/relist-panel:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            RELEASE_KEY=${{ steps.meta.outputs.key }}

      - name: Write and sign the Update manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLIC_KEY: ${{ steps.meta.outputs.key }}
          RELIST_RELEASE_KEY: ${{ secrets.RELIST_RELEASE_KEY }}
        run: |
          go run ./cmd/relist-release manifest --version "$VERSION" --digest "$DIGEST"
          go run ./cmd/relist-release sign
          # Fails when the secret is not the private half of the committed key.
          go run ./cmd/relist-release verify --key "$PUBLIC_KEY"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" update-manifest.json update-manifest.json.sig \
            --title "$TAG" --generate-notes --verify-tag
