version: '3'

tasks:
  default:
    desc: Build the embedded frontend and Go binary
    cmds:
      - task: build

  build:
    desc: Build the embedded frontend and Go binary
    deps: [build-web]
    cmds:
      - go build -ldflags "-X main.version={{.VERSION | default "dev"}}" -o relist-panel .

  build-web:
    desc: Generate the embedded frontend assets
    cmds:
      - go generate ./internal/webassets/...

  test:
    desc: Build the embedded frontend and run the Go tests
    deps: [build-web]
    cmds:
      - go test ./...

  typecheck:
    desc: Typecheck the web frontend
    cmds:
      - pnpm --dir web typecheck

  probe:migration:
    desc: Migrate between two docker:dind hosts with real Docker (manual, needs privileged containers and ~12 GB)
    cmds:
      - ./scripts/probe-migration.sh

  probe:panel-update:
    desc: Update a panel between two images, once to succeed and once to roll back, inside a docker:dind host (manual, needs privileged containers)
    cmds:
      - ./scripts/probe-panel-update.sh

  probe:traefik-config:
    desc: Update from v0.0.2 to this checkout and install it fresh, checking Traefik's generated static config, inside a docker:dind host (manual, needs privileged containers)
    cmds:
      - ./scripts/probe-traefik-config.sh

  e2e:
    desc: Build this checkout into its sandbox and run the Playwright e2e specs (task e2e -- basic-auth runs one file)
    dir: e2e
    cmds:
      - ../scripts/e2e-sandbox.sh serve # builds this checkout into the sandbox first
      - pnpm install --frozen-lockfile --silent
      - pnpm exec playwright install chromium
      - pnpm exec playwright test {{.CLI_ARGS}}

  e2e:serve:
    desc: Start (or reuse) this checkout's isolated install stack in docker:dind; ports and credentials go to .data/e2e/env
    cmds:
      - ./scripts/e2e-sandbox.sh serve

  e2e:reload:
    desc: Rebuild the panel from this checkout into its running e2e sandbox, keeping its data
    cmds:
      - ./scripts/e2e-sandbox.sh reload

  e2e:ls:
    desc: List every e2e sandbox on this host and the checkout it belongs to
    cmds:
      - ./scripts/e2e-sandbox.sh ls

  e2e:down:
    desc: Remove this checkout's e2e sandbox
    cmds:
      - ./scripts/e2e-sandbox.sh down

  sandbox:migration:
    desc: Start two docker:dind panels, the old one seeded, to try a migration by hand
    cmds:
      - ./scripts/sandbox-migration.sh

  sandbox:migration:down:
    desc: Remove the migration sandbox
    cmds:
      - ./scripts/sandbox-migration.sh down

  sandbox:migration:reload:
    desc: Rebuild the panel and put it into the running migration sandbox, keeping its data
    cmds:
      - ./scripts/sandbox-migration.sh reload

  sandbox:migration:check:
    desc: Check that the new host of the migration sandbox has everything the seed made on the old one
    cmds:
      - ./scripts/sandbox-migration.sh check

  sandbox:migration:reset:
    desc: Wipe the migration sandbox back to the start, the old panel reseeded and the new one empty
    cmds:
      - ./scripts/sandbox-migration.sh reset
