version: '3'

tasks:
  default:
    desc: Build the embedded frontend and Go binary
    cmds:
      - task: build

  build:
    desc: Build the embedded frontend and Go binary
    deps: [build-web]
    cmds:
      - go build -o relist-panel .

  build-web:
    desc: Generate the embedded frontend assets
    cmds:
      - go generate ./internal/webassets/...

  test:
    desc: Build the embedded frontend and run the Go tests
    deps: [build-web]
    cmds:
      - go test ./...

  typecheck:
    desc: Typecheck the web frontend
    cmds:
      - pnpm --dir web typecheck

  probe:migration:
    desc: Migrate between two docker:dind hosts with real Docker (manual, needs privileged containers and ~12 GB)
    cmds:
      - ./scripts/probe-migration.sh

  sandbox:migration:
    desc: Start two docker:dind panels, the old one seeded, to try a migration by hand
    cmds:
      - ./scripts/sandbox-migration.sh

  sandbox:migration:down:
    desc: Remove the migration sandbox
    cmds:
      - ./scripts/sandbox-migration.sh down

  sandbox:migration:reload:
    desc: Rebuild the panel and put it into the running migration sandbox, keeping its data
    cmds:
      - ./scripts/sandbox-migration.sh reload

  sandbox:migration:reset:
    desc: Wipe the migration sandbox back to the start, the old panel reseeded and the new one empty
    cmds:
      - ./scripts/sandbox-migration.sh reset
