# Example Install override. Copy to docker-compose.override.yml to keep local
# changes across a Panel update: Compose merges that file over
# docker-compose.yml, and Panel update never replaces it.
services:
  panel:
    # A checkout that builds the panel from source copies this file to
    # docker-compose.override.yml and keeps this block. Panel update refuses
    # such an Install (the service-image invariant), so it never updates itself.
    build: .
    image: relist-panel:local
    pull_policy: build
    # The rest are examples; uncomment what you need.
    # labels:
    #   # One extra label on the panel Service.
    #   - com.example.owner=ops
    # volumes:
    #   # One extra volume on the panel Service.
