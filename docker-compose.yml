services:
  panel:
    build: .
    environment:
      RELIST_PORT: ${RELIST_PORT:-8080}
      RELIST_DATA_DIR: ${RELIST_DATA_DIR:-/var/lib/relist-panel}
    ports:
      - "${RELIST_PORT:-8888}:${RELIST_PORT:-8080}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RELIST_DATA_DIR:-/var/lib/relist-panel}:${RELIST_DATA_DIR:-/var/lib/relist-panel}
      # Read-only host /proc for the metrics sampler (ADR-0006): network
      # counters are read from /host/proc/1/net/dev because /proc/net/dev is
      # /proc/self/net/dev and would report the panel's own namespace.
      - /proc:/host/proc:ro
    networks:
      - relist-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.panel.rule=Host(`${RELIST_DOMAIN:-panel.localhost}`)
      - traefik.http.services.panel.loadbalancer.server.port=${RELIST_PORT:-8080}
    cpus: 0.25
    mem_limit: 256M
    restart: unless-stopped

  traefik:
    image: traefik:v3.7
    environment:
      # Go can't see the cgroup mem_limit, so without GOMEMLIMIT the heap grows
      # until the kernel OOM-kills the container instead of the GC stepping in.
      # Keep it under mem_limit; 400MiB ≈ 80% of the 512M limit.
      GOMEMLIMIT: 400MiB
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # Traefik v3 defaults readTimeout to 60s for the whole request body. The
      # Images upload streams up to 10 GiB, so the limit is one hour for every
      # app on the `web` entrypoint.
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=3600s
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - relist-network
    cpus: 1
    mem_limit: 512M
    restart: unless-stopped

# relist-network is external: it must outlive this install stack's own
# lifecycle, since every deployed Compose (ticket 08+) also attaches to it,
# so `docker compose down` here must never be able to tear it down. Create it
# once before the first `docker compose up` (see README) — the panel also
# ensures it exists on its own startup as a best-effort self-heal, per
# ADR-0002, for runs that don't go through this compose file at all.
networks:
  relist-network:
    external: true
    name: relist-network
