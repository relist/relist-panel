# Install file: Panel update replaces this file, so do not edit it.
# Put your changes in docker-compose.override.yml (see
# docker-compose.override.example.yml) and in .env. See the README.
services:
  panel:
    container_name: relist-panel
    # Panel update and the Install script write the digest ref here (.env).
    image: ${RELIST_PANEL_IMAGE:-ghcr.io/relist/relist-panel:latest}
    environment:
      RELIST_PORT: ${RELIST_PORT:-8080}
      RELIST_DATA_DIR: ${RELIST_DATA_DIR:-/var/lib/relist-panel}
      # Read by a server migration's preflight (ADR-0018): these live in the
      # install's .env, not the data directory, so the operator copies them.
      RELIST_DOMAIN: ${RELIST_DOMAIN:-panel.localhost}
      RELIST_ACME_EMAIL: ${RELIST_ACME_EMAIL:-}
      TRAEFIK_HTTP_PORT: ${TRAEFIK_HTTP_PORT:-80}
      TRAEFIK_HTTPS_PORT: ${TRAEFIK_HTTPS_PORT:-443}
      # Go can't see the cgroup mem_limit; keep this under it so the GC steps
      # in before the kernel OOM-kills the panel.
      GOMEMLIMIT: 200MiB
    ports:
      # Loopback only: reach the panel through Traefik, or an SSH tunnel when
      # routing is broken. A published port on every interface would bypass TLS.
      - "127.0.0.1:${RELIST_PORT:-8888}:${RELIST_PORT:-8080}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RELIST_DATA_DIR:-/var/lib/relist-panel}:${RELIST_DATA_DIR:-/var/lib/relist-panel}
      # Read-only host /proc for the metrics sampler (ADR-0006): network
      # counters are read from /host/proc/1/net/dev because /proc/net/dev is
      # /proc/self/net/dev and would report the panel's own namespace.
      - /proc:/host/proc:ro
    networks:
      - relist-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.panel.rule=Host(`${RELIST_DOMAIN:-panel.localhost}`)
      - traefik.http.routers.panel.entrypoints=websecure
      - traefik.http.routers.panel.tls.certresolver=letsencrypt
      - traefik.http.routers.panel.service=panel
      # Top priority, so no Domain's longer rule can outrank the panel's own host.
      - traefik.http.routers.panel.priority=100000
      - traefik.http.routers.panel-http.rule=Host(`${RELIST_DOMAIN:-panel.localhost}`)
      - traefik.http.routers.panel-http.entrypoints=web
      - traefik.http.routers.panel-http.middlewares=panel-redirect
      - traefik.http.routers.panel-http.priority=100000
      - traefik.http.routers.panel-http.service=panel
      - traefik.http.middlewares.panel-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.panel-redirect.redirectscheme.permanent=true
      - traefik.http.services.panel.loadbalancer.server.port=${RELIST_PORT:-8080}
    cpus: 0.25
    mem_limit: 256M
    # Docker's json-file driver never rotates by default; cap it so stdout
    # cannot fill the disk. Long-term records are the Access log (ADR-0027).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  # Writes Traefik's static config, <data dir>/.traefik/static/traefik.yml,
  # before Traefik starts on every `up` (ADR-0030): the panel's base merged
  # with the Traefik override you edit on the Traefik page. On the first run
  # it creates the override from the running Traefik's flags, or from
  # RELIST_ACME_EMAIL and TRAEFIK_TRUSTED_IPS in .env; after that those two
  # keys are not read. It exits 0 unless there is no usable traefik.yml.
  traefik-config:
    container_name: relist-traefik-config
    image: ${RELIST_PANEL_IMAGE:-ghcr.io/relist/relist-panel:latest}
    command: ["traefik-config"]
    restart: "no"
    environment:
      RELIST_DATA_DIR: ${RELIST_DATA_DIR:-/var/lib/relist-panel}
      RELIST_ACME_EMAIL: ${RELIST_ACME_EMAIL:-}
      TRAEFIK_TRUSTED_IPS: ${TRAEFIK_TRUSTED_IPS:-}
    volumes:
      - ${RELIST_DATA_DIR:-/var/lib/relist-panel}:${RELIST_DATA_DIR:-/var/lib/relist-panel}
      # Read-only: it only reads the running Traefik's flags.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: none
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  traefik:
    container_name: relist-traefik
    image: traefik:v3.7
    environment:
      # Go can't see the cgroup mem_limit, so without GOMEMLIMIT the heap grows
      # until the kernel OOM-kills the container instead of the GC stepping in.
      # Keep it under mem_limit; 400MiB ≈ 80% of the 512M limit.
      GOMEMLIMIT: 400MiB
    # All static config is in the generated file; change it on the Traefik
    # page, not here (ADR-0030).
    command: ["--configfile=/etc/traefik/traefik.yml"]
    depends_on:
      traefik-config:
        condition: service_completed_successfully
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - ${RELIST_DATA_DIR:-/var/lib/relist-panel}/.traefik:/letsencrypt
      # Mounted on its own so Docker creates it before Traefik starts: the
      # file provider never retries a directory missing at start (ADR-0022).
      - ${RELIST_DATA_DIR:-/var/lib/relist-panel}/.traefik/dynamic:/letsencrypt/dynamic
      # A directory, not the file: a rename over traefik.yml stays visible.
      - ${RELIST_DATA_DIR:-/var/lib/relist-panel}/.traefik/static:/etc/traefik:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - relist-network
    cpus: 1
    mem_limit: 512M
    # Docker's json-file driver never rotates by default; cap it so stdout
    # cannot fill the disk. Long-term records are the Access log (ADR-0027).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

# relist-network is external: it must outlive this install stack's own
# lifecycle, since every deployed Compose (ticket 08+) also attaches to it,
# so `docker compose down` here must never be able to tear it down. Create it
# once before the first `docker compose up` (see README) — the panel also
# ensures it exists on its own startup as a best-effort self-heal, per
# ADR-0002, for runs that don't go through this compose file at all.
networks:
  relist-network:
    external: true
    name: relist-network
